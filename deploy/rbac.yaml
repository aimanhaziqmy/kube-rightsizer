apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-rightsizer
  namespace: kube-rightsizer
  labels:
    app.kubernetes.io/name: kube-rightsizer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-rightsizer
  labels:
    app.kubernetes.io/name: kube-rightsizer
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - nodes
      - services
      - configmaps
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources:
      - rollouts
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-rightsizer
  labels:
    app.kubernetes.io/name: kube-rightsizer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-rightsizer
subjects:
  - kind: ServiceAccount
    name: kube-rightsizer
    namespace: kube-rightsizer
