apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-rightsizer
  namespace: kube-rightsizer
  labels:
    app.kubernetes.io/name: kube-rightsizer
    app.kubernetes.io/part-of: kube-rightsizer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-rightsizer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-rightsizer
    spec:
      serviceAccountName: kube-rightsizer
      containers:
        - name: kube-rightsizer
          image: scriptertech/kube-rightsizer:v1.0.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATA_DIR
              value: "/data/scans"
            - name: STATIC_DIR
              value: "/srv/dist"
            - name: PROMETHEUS_URL
              value: "http://prometheus-k8s.monitoring.svc:9090"
            - name: CLUSTER_NAME
              value: "kubernetes-cluster"
            - name: KEEP_SCANS
              value: "30"
            - name: SCAN_TIMEOUT
              value: "1800"
            # Optional HTTP Basic Authentication:
            # - name: AUTH_USER
            #   value: "admin"
            # - name: AUTH_PASSWORD
            #   value: "changeme"
          volumeMounts:
            - name: scan-data
              mountPath: /data/scans
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: scan-data
          persistentVolumeClaim:
            claimName: kube-rightsizer-data
