apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kube-rightsizer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-rightsizer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kube-rightsizer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kube-rightsizer.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kube-rightsizer.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATA_DIR
              value: {{ .Values.config.dataDir | quote }}
            - name: STATIC_DIR
              value: {{ .Values.config.staticDir | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.config.prometheusUrl | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.config.clusterName | quote }}
            - name: KEEP_SCANS
              value: {{ .Values.config.keepScans | quote }}
            - name: EXCLUDED_NAMESPACES
              value: {{ .Values.config.excludedNamespaces | quote }}
            - name: SIDECAR_CONTAINERS
              value: {{ .Values.config.sidecarContainers | quote }}
            - name: SCAN_TIMEOUT
              value: {{ .Values.config.scanTimeout | quote }}
            {{- if .Values.config.auth.enabled }}
            - name: AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.auth.existingSecret | default (printf "%s-auth" (include "kube-rightsizer.fullname" .)) }}
                  key: AUTH_USER
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.auth.existingSecret | default (printf "%s-auth" (include "kube-rightsizer.fullname" .)) }}
                  key: AUTH_PASSWORD
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: scan-data
              mountPath: {{ .Values.config.dataDir }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: scan-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "kube-rightsizer.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
