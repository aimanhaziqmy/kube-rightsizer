{{- if and .Values.config.auth.enabled (not .Values.config.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-rightsizer.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-rightsizer.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_USER: {{ .Values.config.auth.username | quote }}
  AUTH_PASSWORD: {{ .Values.config.auth.password | quote }}
{{- end }}

