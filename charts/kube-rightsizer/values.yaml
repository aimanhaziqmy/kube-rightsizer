# Default values for kube-rightsizer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: scriptertech/kube-rightsizer
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v1.1.3"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

commonLabels: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # Specifies whether RBAC ClusterRole and ClusterRoleBinding should be created
  create: true
  # Annotations for RBAC resources
  annotations: {}

# Application configuration passed as environment variables
config:
  prometheusUrl: "http://prometheus-k8s.monitoring.svc:9090"
  clusterName: "kubernetes-cluster"
  dataDir: "/data/scans"
  staticDir: "/srv/dist"
  keepScans: 30
  scanTimeout: 1800
  # Namespaces excluded from recommendations (comma-separated)
  excludedNamespaces: "kube-system"
  # Well-known sidecar container names tagged in the UI (comma-separated)
  sidecarContainers: "istio-proxy,envoy,linkerd-proxy,linkerd2-proxy,jaeger-agent,otel-collector,datadog-agent"
  auth:
    enabled: false
    # Optional existing secret containing AUTH_USER and AUTH_PASSWORD keys
    existingSecret: ""
    username: ""
    password: ""

persistence:
  enabled: true
  # If using an existing PVC, specify its name here
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  storageClass: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kube-rightsizer.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: kube-rightsizer-tls
  #    hosts:
  #      - kube-rightsizer.local

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 2

# Additional environment variables to pass to the container
env: []

# Extra volumes and volume mounts
extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
